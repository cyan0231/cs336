deepseek_flash_judge:
  prompt_template: "deepseek_judge/prompt.txt"

  fn_completions: "openai_completions"
  fn_completion_parser: "ranking_parser"

  is_randomize_output_order: true

  completions_kwargs:
    model_name: "deepseek-flash"
    temperature: 0.0
    max_tokens: 256

    requires_chatml: true
    num_procs: 1
    batch_size: 1
    n_retries: 1

    client_kwargs:
      timeout: 60.0
      max_retries: 0

    extra_body:
      thinking:
        type: "disabled"